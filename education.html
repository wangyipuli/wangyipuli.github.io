<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F6F3; --ink: #1A1A1A; --ink-muted: #6B6B6B;
      --accent: #2D5BE3; --accent-light: #EEF2FD; --rule: #E0DDD8;
      --serif: "Noto Serif SC", Georgia, serif;
      --sans: "Noto Sans SC", system-ui, sans-serif;
    }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; line-height: 1.7; min-height: 100vh; }
    .page { max-width: 860px; margin: 0 auto; padding: 0 24px 80px; }
    nav { position: sticky; top: 0; z-index: 100; background: rgba(247,246,243,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
    .nav-inner { max-width: 860px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav-inner a { display: block; padding: 14px 16px; font-size: .88rem; font-weight: 500; color: var(--ink-muted); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
    .nav-inner a:hover, .nav-inner a.active { color: var(--accent); border-bottom-color: var(--accent); }
    .page-header { padding: 52px 0 36px; border-bottom: 1px solid var(--rule); }
    .page-header h1 { font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; }
    .section { padding: 40px 0 0; }
    .section-label { font-family: var(--serif); font-size: .78rem; letter-spacing: .14em; color: var(--ink-muted); text-transform: uppercase; margin-bottom: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--rule); }
    .entry { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin-bottom: 32px; align-items: start; }
    .entry-title { font-family: var(--serif); font-size: 1.05rem; font-weight: 600; line-height: 1.3; }
    .entry-org { font-size: .93rem; color: var(--accent); font-weight: 500; margin-top: 2px; }
    .entry-date { font-size: .82rem; color: var(--ink-muted); white-space: nowrap; text-align: right; padding-top: 3px; }
    .entry-desc { grid-column: 1 / -1; font-size: .92rem; color: var(--ink-muted); margin-top: 8px; max-width: 620px; }
    .entry-desc ul { padding-left: 1.2em; }
    .entry-desc li { margin-bottom: 4px; }
    footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--rule); font-size: .82rem; color: var(--ink-muted); }
    footer a { color: var(--accent); text-decoration: none; }
    @media (max-width: 540px) { .entry { grid-template-columns: 1fr; } .entry-date { text-align: left; } }
    @media (prefers-reduced-motion: no-preference) {
      .page-header, .section { animation: fadeUp .45s ease both; }
      .section { animation-delay: .1s; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
